<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Donor CRM{% endblock %} — Always &amp; Furever</title>
<style>
  :root{--ink:#1f2933;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f7f5;
        --brand:#2f6f4f;--brand2:#b5651d;--card:#fff;--accent:#eef5f0;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  header{background:var(--brand);color:#fff;padding:0 20px}
  header .wrap{display:flex;align-items:center;gap:22px;max-width:1100px;margin:0 auto;height:56px}
  header .brand{font-weight:700;font-size:17px;color:#fff}
  header .brand small{font-weight:400;opacity:.8}
  header nav{display:flex;gap:18px;margin-left:auto}
  header nav a{color:#e7f0ea;font-size:14px}
  header nav a:hover{color:#fff;text-decoration:none}
  .container{max-width:1100px;margin:24px auto;padding:0 20px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:16px;margin:24px 0 10px;color:var(--ink)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .stat{font-size:26px;font-weight:700;color:var(--brand)}
  .stat.alt{color:var(--brand2)}
  .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{background:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#3f5c4d}
  tr:last-child td{border-bottom:none}
  .right{text-align:right}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--accent);color:#3f5c4d}
  .pill.warn{background:#fdeccd;color:#92560f}
  .muted{color:var(--muted)}
  input,select,button,textarea{font:inherit}
  input[type=text],input[type=date],input[type=search],select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:7px;cursor:pointer}
  .btn:hover{background:#27593f;text-decoration:none}
  .btn.sm{padding:5px 10px;font-size:13px}
  form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .flash{background:#eef5f0;border:1px solid #cfe3d6;color:#2f6f4f;padding:10px 14px;border-radius:8px;margin-bottom:16px}
  .flex{display:flex;gap:24px;flex-wrap:wrap}
  .col{flex:1;min-width:280px}
  .demo{background:#fff7ec;border-bottom:1px solid #f0dcc0;color:#92560f;font-size:13px;text-align:center;padding:5px}
</style>
</head>
<body>
<div class="demo">Demo data — Phase 1 prototype. No real donor records.</div>
<header>
  <div class="wrap">
    <span class="brand">🐾 Always &amp; Furever <small>Donor CRM</small></span>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('donors') }}">Donors</a>
      <a href="{{ url_for('donations') }}">Donations</a>
      <a href="{{ url_for('reports') }}">Reports</a>
      <a href="{{ url_for('import_page') }}">Import</a>
    </nav>
  </div>
</header>
<div class="container">
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
