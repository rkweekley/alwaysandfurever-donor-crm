<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} — Always &amp; Furever Donor CRM</title>
<link rel="icon" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Red+Hat+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--brand:#017BB5;--brand-dark:#014769;--green-bright:#32E071;--ink:#141B38;--muted:#5b6577}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font:15px/1.55 "Red Hat Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#014769 0%,#017BB5 70%,#1FA84A 150%)}
  .box{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(1,40,60,.35);
    max-width:420px;width:100%;text-align:center;overflow:hidden}
  .head{background:var(--brand-dark);padding:22px}
  .head img{height:40px}
  .body{padding:30px 30px 34px}
  .code{font-family:"Domine",serif;font-size:54px;font-weight:700;color:var(--brand);line-height:1;margin:0}
  h1{font-family:"Domine",serif;font-size:20px;margin:10px 0 6px}
  p{color:var(--muted);margin:0 0 22px}
  .btn{display:inline-block;background:var(--brand);color:#fff;padding:10px 20px;border-radius:9px;
    font-weight:600;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <img src="{{ url_for('static', filename='nav-logo.svg') }}" alt="Always &amp; Furever">
    </div>
    <div class="body">
      <p class="code">{{ code }}</p>
      <h1>{% if code == 404 %}Page not found{% elif code == 400 %}Bad request{% elif code == 429 %}Slow down{% else %}Something went wrong{% endif %}</h1>
      <p>{{ message }}</p>
      <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
    </div>
  </div>
</body>
</html>
