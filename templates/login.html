<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Always &amp; Furever Donor CRM</title>
<link rel="icon" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;600;700&family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#017BB5;--brand-dark:#014769;--brand2:#1FA84A;--green-bright:#32E071;
    --ink:#141B38;--muted:#5b6577;--line:#dbe7ef;--card:#fff;--accent:#e2f5ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 "Red Hat Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#014769 0%,#017BB5 60%,#1FA84A 140%)}
  h1{font-family:"Domine",Georgia,serif}
  .card{background:var(--card);width:100%;max-width:380px;border-radius:16px;
    box-shadow:0 20px 50px rgba(1,40,60,.35);overflow:hidden}
  .head{background:var(--brand-dark);padding:26px 28px 22px;text-align:center}
  .head img{height:46px;width:auto;margin-bottom:6px}
  .head .crm{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--green-bright);border:1px solid rgba(50,224,113,.45);border-radius:999px;padding:2px 10px;margin-top:4px}
  .body{padding:26px 28px 30px}
  .body h1{font-size:20px;margin:0 0 4px;text-align:center}
  .body .sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 5px}
  input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;background:#fff;font:inherit}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(1,123,181,.15)}
  .btn{width:100%;margin-top:22px;background:var(--brand);color:#fff;border:none;padding:12px;
    border-radius:9px;cursor:pointer;font-weight:600;font-size:15px}
  .btn:hover{background:var(--brand-dark)}
  .flash{background:#fde8e8;border:1px solid #f5b5b5;color:#9b2222;padding:10px 13px;border-radius:9px;
    font-size:13px;margin-bottom:6px;text-align:center}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="{{ url_for('static', filename='nav-logo.svg') }}" alt="Always &amp; Furever">
      <div><span class="crm">Donor CRM</span></div>
    </div>
    <div class="body">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage donors and giving.</p>
      {% with msgs = get_flashed_messages() %}
        {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endwith %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <div class="foot">Always &amp; Furever · Donor CRM</div>
    </div>
  </div>
</body>
</html>
